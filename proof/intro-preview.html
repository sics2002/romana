<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinemana identity preview</title><link rel="stylesheet" href="../src/styles.css"><style>body{margin:0}.preview-controls{position:fixed;z-index:1100;bottom:20px;left:20px;display:flex;gap:12px;background:#10131bd9;padding:10px;border-radius:8px;font:14px Arial}.preview-controls button{color:white;padding:8px;background:#343946}#intro{pointer-events:none}</style><body><div id="intro" aria-hidden="true"><div class="intro-aura"></div><div class="intro-streak"></div><div class="intro-lockup" dir="ltr"><div class="intro-symbol"><img src="../static/intro-logo.jpg" alt="" fetchpriority="high"></div><div class="intro-type"><div class="intro-word"><span class="intro-letter" style="--delay:0.55s">c</span><span class="intro-letter" style="--delay:0.71s">i</span><span class="intro-letter" style="--delay:0.87s">n</span><span class="intro-letter" style="--delay:1.03s">e</span><span class="intro-letter" style="--delay:1.19s">m</span><span class="intro-letter" style="--delay:1.35s">a</span><span class="intro-letter" style="--delay:1.51s">n</span><span class="intro-letter" style="--delay:1.67s">a</span></div><div class="intro-credit"><span class="intro-letter" style="--delay:1.95s">b</span><span class="intro-letter" style="--delay:2.02s">y</span><span class="intro-letter" style="--delay:2.08s">&nbsp;</span><span class="intro-letter" style="--delay:2.15s">s</span><span class="intro-letter" style="--delay:2.21s">i</span><span class="intro-letter" style="--delay:2.27s">c</span><span class="intro-letter" style="--delay:2.34s">s</span><span class="intro-letter" style="--delay:2.40s">2</span><span class="intro-letter" style="--delay:2.47s">0</span><span class="intro-letter" style="--delay:2.54s">0</span><span class="intro-letter" style="--delay:2.60s">2</span></div></div></div></div><div class="preview-controls"><button id="replay">Replay</button><button id="pause">Pause</button><button id="frame">Brand frame</button></div><script>const intro=document.getElementById('intro');document.getElementById('replay').onclick=()=>{for(const a of intro.getAnimations({subtree:true})){a.currentTime=0;a.play()}};document.getElementById('pause').onclick=()=>{for(const a of intro.getAnimations({subtree:true}))a.pause()};document.getElementById('frame').onclick=()=>{for(const a of intro.getAnimations({subtree:true})){a.pause();a.currentTime=2850}};</script></body></html>
